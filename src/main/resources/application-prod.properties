#DATASOURCE
spring.datasource.url=${DB_URL:jdbc:mysql://db_manager:3306/aiquery_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA, SQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

#GenAI
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY}

#CRYPTOGRAPHY
app.crypto.secret=${SECRET:0123456789abcdef0123456789abcdef}

# JWT
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef}
app.jwt.expirationMs=86400000


#DevTools
spring.devtools.restart.enabled=false


# Impede o Spring Boot de testar a conexão com o banco na inicialização
spring.datasource.continue-on-error=true

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG