#DATASOURCE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aiquery}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA, SQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

#GenAI
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY}

#CRYPTOGRAPHY
app.crypto.secret=${SECRET:0123456789abcdef0123456789abcdef}

# JWT
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef}
app.jwt.expirationMs=86400000


#DevTools
spring.devtools.restart.enabled=false